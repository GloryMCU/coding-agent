[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glory-coding-agent"
version = "0.1.0"
description = "A minimal coding agent built without an agent framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
deepseek = ["openai>=1.0"]
tui = ["textual>=1.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coding_agent.migrations" = ["*.sql"]
